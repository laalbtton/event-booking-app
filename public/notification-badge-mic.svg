<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <defs>
    <clipPath id="micCircleClip">
      <circle cx="48" cy="48" r="31"/>
    </clipPath>
  </defs>

  <!-- Outer ring -->
  <circle cx="48" cy="48" r="37" fill="#fff"/>
  <circle cx="48" cy="48" r="31" fill="#000"/>

  <!-- Subtle inner core -->
  <circle cx="48" cy="48" r="16" fill="#fff"/>
  <circle cx="48" cy="48" r="12" fill="#000"/>

  <!-- Grill mesh -->
  <g clip-path="url(#micCircleClip)" stroke="#fff" stroke-width="2.2" stroke-linecap="round" opacity="0.9">
    <!-- Diagonal set 1 -->
    <line x1="8" y1="28" x2="88" y2="68"/>
    <line x1="8" y1="20" x2="88" y2="60"/>
    <line x1="8" y1="36" x2="88" y2="76"/>
    <line x1="8" y1="44" x2="88" y2="84"/>
    <line x1="8" y1="12" x2="88" y2="52"/>
    <!-- Diagonal set 2 -->
    <line x1="8" y1="68" x2="88" y2="28"/>
    <line x1="8" y1="60" x2="88" y2="20"/>
    <line x1="8" y1="76" x2="88" y2="36"/>
    <line x1="8" y1="84" x2="88" y2="44"/>
    <line x1="8" y1="52" x2="88" y2="12"/>
  </g>
</svg>
